# The splash page of iroof.top (landing/, generated by scripts/landing-i18n.py).
# `check` fails when the generated pages are out of date with their sources. `deploy` copies the site to the
# server on push to main (Caddy serves /srv/edge/iroof/site), and runs only when the secrets are set:
#   VPS_HOST         the server's address
#   VPS_USER         the SSH user that owns /srv/edge/iroof/site
#   VPS_SSH_KEY      a private deploy key (no passphrase) whose public half is in that user's authorized_keys
#   VPS_KNOWN_HOSTS  the server's host keys (ssh-keyscan -H <host>)
# Without them the deploy step is skipped with a notice.
name: Landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'scripts/landing-*'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - 'scripts/landing-*'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The pages match their sources (landing-i18n.py)
        run: |
          python3 scripts/landing-i18n.py
          if [ -n "$(git status --porcelain -- landing)" ]; then
            git status --short -- landing
            echo "::error::landing/ is out of date: run python3 scripts/landing-i18n.py and commit the result"
            exit 1
          fi
      - name: No link to the old docs location
        run: |
          if grep -rn 'irooftop.github.io/rooftop' landing; then
            echo "::error::landing/ links to the old docs path (irooftop.github.io/rooftop)"
            exit 1
          fi

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Check the deploy secrets
        id: creds
        run: |
          if [ "$HAS_KEY" = true ] && [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets: the site was not copied to the server"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - name: Copy the site to the server
        if: steps.creds.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlt --exclude .DS_Store -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            landing/ "$VPS_USER@$VPS_HOST:/srv/edge/iroof/site/"
          rm -f ~/.ssh/deploy_key
